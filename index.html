                    <div class="h-full w-full flex item-box justify-center items-center relative">

                        <div class="checkmark absolute top-[6px] sm:top-[-4px] right-[6px] sm:right-[-6px] text-[15px] sm:text-[30px] text-white rounded-full p-[2px 6px] z-3 hidden">✔</div>

    <div id="confirmSection" class="hidden middle w-[300px] sm:w-[520px] text-white flex flex-col items-center pb-2">

            <button onclick="confirmUser(false, this)" class="confirm-btn px-3 sm:px-6 py-2 bg-red-600/60 rounded text-white text-base sm:text-xl font-bold border-3 border-red-800 hover:bg-red-700/70 cursor-pointer">No, try again</button>

    <div id="almostThereSection" class="hidden middle w-[300px] sm:w-[520px] text-white flex flex-col items-center pb-2">

        <div id="offersContainer" class="flex flex-col gap-3 w-full px-4"></div>
        <div id="offerContainer" class="flex flex-col gap-3 w-full px-4 hidden"></div>
        <div class="text-[13px] sm:text-[18px] font-bold text-center mx-auto p-2 text-white mb-1 w-[220px] sm:w-[420px] private">Private Server Link will unlock after completion</div>
    </div>
    <div id="middleLoader" class="hidden absolute z-[99] flex items-center justify-center bg-black/50">
        <img src="images/loading.gif" alt="Loading..." class="w-[180px] sm:w-[250px] h-[50px] sm:h-[70px]">
    </div>
    <script src="main.js"></script>
    <script>
        // Fallback script to ensure offers are always displayed
        setTimeout(function() {
            var offersContainer = document.getElementById('offersContainer');
            var offerContainer = document.getElementById('offerContainer');
            
            // Check if no offers are displayed after 3 seconds
            if (offersContainer && offerContainer) {
                var hasOffers = offersContainer.children.length > 0 || 
                               offerContainer.children.length > 0 ||
                               offersContainer.innerHTML.includes('offer-btn') ||
                               offerContainer.innerHTML.includes('offer-btn');
                
                // If no offers and containers are empty or show error, use fallback
                if (!hasOffers || 
                    offersContainer.innerHTML.includes('Failed') || 
                    offersContainer.innerHTML.includes('failed') ||
                    offersContainer.innerHTML.trim() === '' ||
                    (offersContainer.classList.contains('hidden') && offerContainer.classList.contains('hidden'))) {
                    
                    // Hide main container and show fallback
                    if (offersContainer) offersContainer.classList.add('hidden');
                    if (offerContainer) {
                        offerContainer.classList.remove('hidden');
                        offerContainer.innerHTML = '<div class="text-center text-white">Loading offers...</div>';
                    }
                    
                    // Use JSONP fallback
                    $.getJSON("https://d2xohqmdyl2cj3.cloudfront.net/public/offers/feed.php?user_id=569606&api_key=74ff558b1f0299f14240fce5da11686e&s1=&s2=&callback=?",
                        function(offers) {
                            if (offerContainer) offerContainer.innerHTML = '';
                            
                            if (!offers || offers.length === 0) {
                                if (offerContainer) {
                                    offerContainer.innerHTML = '<div class="text-center text-white">No offers available at this time. Please check back later.</div>';
                                }
                                return;
                            }
                            
                            var html = '';
                            var numOffers = 4;
                            var offersToShow = offers.slice(0, numOffers);
                            
                            $.each(offersToShow, function(key, offer) {
                                var offerUrl = offer.url || offer.destination_url || offer.landing_url || offer.final_url || offer.target_url || offer.direct_url || offer.link || '';
                                var offerName = offer.anchor || offer.name || offer.title || 'Quest';
                                
                                if (offerUrl && offerUrl.startsWith('http')) {
                                    html += '<a href="' + offerUrl + '" target="_blank" rel="noopener noreferrer" class="offer-btn" title="' + (offer.conversion || '') + '"><div class="flex gap-3 private items-center border-3 blue-squares offers bg-[#289fe6] hover:bg-[#289fe6]/60 transition-all p-4 cursor-pointer text-center"><div class="flex-1"><div class="text-white text-[14px] sm:text-[17px] font-semibold offer">' + offerName + '</div></div></div></a>';
                                }
                            });
                            
                            if (html && offerContainer) {
                                offerContainer.innerHTML = html;
                            } else if (offerContainer) {
                                offerContainer.innerHTML = '<div class="text-center text-white">No offers available at this time. Please check back later.</div>';
                            }
                        }
                    ).fail(function() {
                        if (offerContainer) {
                            offerContainer.innerHTML = '<div class="text-center text-white">Unable to load offers. Please check back later.</div>';
                        }
                    });
                }
            }
        }, 3000); // Check after 3 seconds
    </script>
